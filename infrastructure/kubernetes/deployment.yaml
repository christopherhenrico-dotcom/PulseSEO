# PulseSEO Kubernetes Deployment Manifest
# Production-grade deployment for AWS EKS, GKE, or AKS

apiVersion: v1
kind: Namespace
metadata:
  name: pulseseo
  labels:
    app: pulseseo

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseseo-frontend
  namespace: pulseseo
  labels:
    app: pulseseo
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulseseo
      component: frontend
  template:
    metadata:
      labels:
        app: pulseseo
        component: frontend
    spec:
      containers:
      - name: frontend
        image: pulseseo/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseseo-api
  namespace: pulseseo
  labels:
    app: pulseseo
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pulseseo
      component: api
  template:
    metadata:
      labels:
        app: pulseseo
        component: api
    spec:
      containers:
      - name: api
        image: pulseseo/api:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: jwt-secret
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: redis-url
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: stripe-secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: pulseseo-frontend
  namespace: pulseseo
spec:
  selector:
    app: pulseseo
    component: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: pulseseo-api
  namespace: pulseseo
spec:
  selector:
    app: pulseseo
    component: api
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

---
# Ingress (requires ingress-nginx or similar)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseseo-ingress
  namespace: pulseseo
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - app.pulseseo.com
    - api.pulseseo.com
    secretName: pulseseo-tls
  rules:
  - host: app.pulseseo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pulseseo-frontend
            port:
              number: 80
  - host: api.pulseseo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pulseseo-api
            port:
              number: 3001

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulseseo-api-hpa
  namespace: pulseseo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulseseo-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Database (PostgreSQL) - Use managed service in production
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pulseseo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: pulseseo
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: db-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: db-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
# Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pulseseo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pulseseo-secrets
              key: redis-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
# Secrets (in production, use external secrets manager)
apiVersion: v1
kind: Secret
metadata:
  name: pulseseo-secrets
  namespace: pulseseo
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/pulseseo"
  jwt-secret: "CHANGE_ME_TO_RANDOM_STRING"
  jwt-refresh-secret: "CHANGE_ME_TO_RANDOM_STRING"
  redis-url: "redis://:password@redis:6379"
  redis-password: "CHANGE_ME"
  db-username: "pulseseo"
  db-password: "CHANGE_ME_STRONG_PASSWORD"
  stripe-secret-key: "sk_live_CHANGE_ME"
  stripe-webhook-secret: "whsec_CHANGE_ME"
  sendgrid-api-key: "SG.CHANGE_ME"
